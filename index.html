<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b8731">
<title>Misiones de casa</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Misiones">
<link rel="icon" id="ico" href="data:,">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--grass:#5b8731;--grass-l:#7fb23f;--grass-d:#35521c;--dirt:#7a5636;--dirt-d:#6d4c2f;--gui:#c6c6c6;--emer:#17dd62;--ink:#222}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Courier New",Courier,monospace;font-weight:bold;color:var(--ink);
background:var(--dirt) repeating-conic-gradient(var(--dirt-d) 0 25%,var(--dirt) 0 50%) 0 0/32px 32px;
min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.top{background:var(--grass);border:4px solid;border-color:var(--grass-l) var(--grass-d) var(--grass-d) var(--grass-l);outline:3px solid #000;
padding:12px;color:#fff;text-shadow:2px 2px #000;text-align:center;font-size:22px;margin-bottom:18px}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tabs button{flex:1}
.gui{background:var(--gui);border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000;padding:12px;margin-bottom:16px}
.btn,.tabs button{font:inherit;color:#fff;text-shadow:2px 2px #000;background:var(--grass);border:4px solid;
border-color:var(--grass-l) var(--grass-d) var(--grass-d) var(--grass-l);outline:3px solid #000;padding:10px 12px;cursor:pointer;font-size:16px}
.btn:active,.tabs button:active{border-color:var(--grass-d) var(--grass-l) var(--grass-l) var(--grass-d)}
.tabs button.off{background:#777;border-color:#999 #444 #444 #999}
.btn.red{background:#a33;border-color:#d66 #611 #611 #d66}
.btn.small{padding:6px 10px;font-size:14px}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible{outline:3px solid #ff0}
.bal{text-align:center;font-size:24px}
.av{width:96px;height:96px;display:block;margin:0 auto 10px;border:4px solid;border-color:#555 #fff #fff #555;outline:3px solid #000;image-rendering:pixelated;background:#fff}
.bal small{display:block;font-size:15px;margin-top:4px}
.bar{height:22px;background:#555;border:3px solid #000;margin-top:10px}
.bar i{display:block;height:100%;background:var(--emer);width:0;transition:width .4s}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--gui);
border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000;padding:12px;margin-bottom:16px;cursor:pointer;font-size:17px}
.task .ic{font-size:30px}
.task .nm{flex:1}
.task .st{font-size:14px;white-space:nowrap}
.task.p{background:#e8d27a}
.task.ok{background:#8fd18a}
.row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row .nm{flex:1;min-width:120px}
input{font:inherit;padding:8px;border:3px solid #000;background:#fff;width:100%}
input.n{width:70px}
h2{margin:0 0 10px;font-size:18px}
.mute{font-size:14px;color:#444;font-weight:normal}
.hide{display:none}
.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border:3px solid #000;outline:3px solid var(--grass);padding:10px 14px;z-index:60;font-size:16px;max-width:90%;text-align:center}
.btn.off{background:#777;border-color:#999 #444 #444 #999}
.days{display:flex;gap:4px;width:100%}
.days .btn{flex:1;padding:4px 0;font-size:13px;outline-width:2px;border-width:3px}
select{font:inherit;font-size:20px;padding:4px;border:3px solid #000;background:#fff;max-width:90px}

.cr{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.crb{position:relative;overflow:hidden;background:#1b1b1b;border:4px solid #555;outline:3px solid #000;color:#fff;text-align:center;padding:20px;max-width:420px;width:100%;font-size:18px}
.crb p{margin:10px 0}
.crc{display:inline-block;animation:swell .5s ease-in-out infinite alternate}
.crc svg{display:block;image-rendering:pixelated}
.crf{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.crf.flash{animation:flash .5s ease-out}
.boom{font-size:90px;animation:pop .6s ease-out}
@keyframes swell{from{transform:scale(1) translateX(-3px)}to{transform:scale(1.25) translateX(3px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.crc,.crf.flash,.boom{animation:none}}
</style>
</head>

var S=null, view='k', unlocked=false, msg='';

function def(){return{
  tasks:[

    {id:2,n:'Recoger la mesa',i:'🧽',p:1},

    {id:6,n:'Ducha',i:'🚿',p:1},
    {id:7,n:'Ropa sucia al cubo',i:'👕',p:1},
    {id:8,n:'Quitar el lavavajillas',i:'🍴',p:1}
  ],
  log:[], pays:[], rate:0.10, pin:'1234', next:9
};}
function load(){
  try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):def();}catch(e){S=def();}
  if(!S||!S.tasks)S=def();
  S.tasks.forEach(function(t){if(t.i==='⭐')t.i=guess(t.n);});
  if(S.bonus===undefined)S.bonus=2;save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}push();}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return fmt(new Date());}
function todayOld(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var ICONS=['🍽️','🧽','🪥','🛏️','📚','🚿','👕','🍴','🧹','🗑️','🐕','🌱','🧺','🍳','🛒','🚗','🪟','🧸','⛏️','🗡️','🏹','🪓','🐷','🐔','🧱','🔥','💎','⭐'];
var KW=[['basura','🗑️'],['perro','🐕'],['gato','🐕'],['mascota','🐕'],['pasear','🐕'],['planta','🌱'],['regar','🌱'],['barrer','🧹'],['fregar','🧹'],['limpi','🧹'],['polvo','🧹'],['aspira','🧹'],['cocin','🍳'],['compra','🛒'],['ropa','🧺'],['tender','🧺'],['doblar','🧺'],['plancha','🧺'],['cama','🛏️'],['cuarto','🛏️'],['mesa','🍽️'],['diente','🪥'],['deber','📚'],['estudi','📚'],['leer','📚'],['lectura','📚'],['duch','🚿'],['bano','🚿'],['coche','🚗'],['ventana','🪟'],['cristal','🪟'],['juguete','🧸'],['ordenar','🧸'],['lavavajillas','🍴'],['plato','🍴'],['cubiertos','🍴'],['hermano','🧱']];
function guess(n){
  var t=String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(var i=0;i<KW.length;i++){if(t.indexOf(KW[i][0])>-1)return KW[i][1];}
  return '⛏️';
}
function iconOpts(cur,auto){
  var h=auto?'<option value="">🎲 Auto</option>':'';
  ICONS.forEach(function(c){h+='<option value="'+c+'"'+(c===cur?' selected':'')+'>'+c+'</option>';});
  return h;
}
function iconSel(id,cur){return '<select onchange="setIcon('+id+',this.value)" aria-label="Dibujo">'+iconOpts(cur,false)+'</select>';}
function setIcon(id,v){var t=S.tasks.find(function(x){return x.id===id;});t.i=v;save();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function eur(n){return n.toFixed(2).replace('.',',')+' €';}
function entry(id){var d=today();return S.log.find(function(e){return e.d===d&&e.t===id;});}
function balance(){
  var a=S.log.filter(function(e){return e.s==='ok';}).reduce(function(s,e){return s+e.p;},0);
  var b=S.pays.reduce(function(s,e){return s+e.e;},0);
  return a-b;
}

/* Bonus, racha, rangos */
var RK=[['🪵','Madera',0],['🪨','Piedra',25],['⛓️','Hierro',75],['🥇','Oro',150],['💎','Diamante',300],['🔥','Netherita',600]];
function earned(){return S.log.filter(function(e){return e.s==='ok';}).reduce(function(a,e){return a+e.p;},0);}
function rankTxt(){
  var t=earned(),i=0;RK.forEach(function(r,k){if(t>=r[2])i=k;});
  var n=RK[i+1];
  return RK[i][0]+' Rango '+RK[i][1]+(n?' · faltan '+(n[2]-t)+' 💎 para '+n[1]:' · rango máximo');
}
function streakAt(start){
  var set={};S.log.forEach(function(e){if(e.t===0)set[e.d]=1;});
  var c=0,dt=new Date(start);
  while(set[fmt(dt)]){c++;dt.setDate(dt.getDate()-1);}
  return c;
}
function streak(){
  var y=new Date();y.setDate(y.getDate()-1);
  var n=streakAt(new Date());
  return n>0?n:streakAt(y);
}
function bonus(){
  var d=today();
  var all=todays().length>0&&todays().every(function(t){var e=entry(t.id);return e&&e.s==='ok';});
  if(!all||S.log.some(function(e){return e.d===d&&e.t===0;}))return;
  S.log.push({d:d,t:0,n:'Bonus día completo',p:S.bonus,s:'ok'});
  if(streak()%7===0)S.log.push({d:d,t:-1,n:'Racha de 7 días',p:5,s:'ok'});
}

/* Sonido */
function snd(seq){
  try{
    var a=snd.c||(snd.c=new (window.AudioContext||window.webkitAudioContext)());
    var t=a.currentTime;
    seq.forEach(function(f,i){
      var o=a.createOscillator(),g=a.createGain(),st=t+i*0.09;
      o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(0.08,st);g.gain.exponentialRampToValueAtTime(0.001,st+0.08);
      o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+0.09);
    });
  }catch(e){}
}

/* Sincronización con Firebase (REST + eventos en tiempo real) */
var DB='https://despensa-granon-default-rtdb.europe-west1.firebasedatabase.app/tareas_minecraft.json';
var ready=false,dirty=false,last='',tm=null;
function canon(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x];});return r;}return v;});}
function arr(x){return Array.isArray(x)?x:(x?Object.keys(x).map(function(k){return x[k];}):[]);}
function norm(o){
  var d=def();
  o.tasks=arr(o.tasks);o.log=arr(o.log);o.pays=arr(o.pays);
  o.tasks.forEach(function(t){if(t.days)t.days=arr(t.days);});
  ['rate','pin','next','bonus'].forEach(function(k){if(o[k]===undefined)o[k]=(k==='bonus'?2:d[k]);});
  return o;
}
function setNet(b){var e=document.getElementById('net');if(e)e.textContent=b?'🟢 Sincronizado':'⚪ Sin conexión';}
function push(){
  if(!ready)return;
  dirty=true;clearTimeout(tm);
  tm=setTimeout(function(){
    var j=canon(S);last=j;
    fetch(DB,{method:'PUT',body:j}).then(function(r){dirty=false;setNet(r.ok);}).catch(function(){dirty=false;setNet(false);});
  },300);
}
function okCount(){return S.log.filter(function(e){return e.s==='ok';}).length;}
function onRemote(d){
  if(dirty||!d||typeof d!=='object')return;
  var n=norm(d),j=canon(n);
  if(j===last)return;
  var before=okCount();
  S=n;last=j;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(okCount()>before)snd([660,880,1320]);
  var a=document.activeElement;
  if(!(a&&a.tagName==='INPUT'))render();
}
function refetch(){fetch(DB).then(function(r){return r.json();}).then(onRemote).catch(function(){});}
function startSync(){
  fetch(DB).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    ready=true;setNet(true);
    if(d===null){push();}else{onRemote(d);}
    checkCreeper();
    try{
      var es=new EventSource(DB);
      es.addEventListener('put',function(e){var m=JSON.parse(e.data);if(m.path==='/')onRemote(m.data);else refetch();});
      es.addEventListener('patch',refetch);
      es.onopen=function(){setNet(true);};
      es.onerror=function(){setNet(false);};
    }catch(x){}
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refetch();});
  }).catch(function(){setNet(false);setTimeout(startSync,10000);});
}

/* Días, meta y resumen */
var DN=['dom','lun','mar','mié','jue','vie','sáb'];
function todays(){
  var w=new Date().getDay();
  return S.tasks.filter(function(t){return !t.days||!t.days.length||t.days.indexOf(w)>-1;});
}
function dayBtns(t){
  var cur=(t.days&&t.days.length)?t.days:[0,1,2,3,4,5,6],L={1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',0:'D'},h='<div class="days">';
  [1,2,3,4,5,6,0].forEach(function(d){
    h+='<button class="btn small'+(cur.indexOf(d)>-1?'':' off')+'" onclick="toggleDay('+t.id+','+d+')" aria-label="'+DN[d]+'">'+L[d]+'</button>';
  });
  return h+'</div>';
}
function toggleDay(id,d){
  var t=S.tasks.find(function(x){return x.id===id;});
  var cur=(t.days&&t.days.length)?t.days.slice():[0,1,2,3,4,5,6],i=cur.indexOf(d);
  if(i>-1){if(cur.length===1)return;cur.splice(i,1);}else cur.push(d);
  if(cur.length===7)delete t.days;else t.days=cur;
  save();render();
}
function setGoal(){
  var n=document.getElementById('gn').value.trim();
  var e=parseFloat(document.getElementById('ge').value.replace(',','.'));
  if(!n||isNaN(e)||e<=0){toast('Escribe el premio y su precio en €');return;}
  S.goal={n:n,eur:e};msg='Meta guardada';save();render();
}
function delGoal(){delete S.goal;msg='Meta quitada';save();render();}
function week(){
  var out=[],t=new Date();
  for(var i=0;i<7;i++){
    var d=new Date(t);d.setDate(t.getDate()-i);
    var k=fmt(d),es=S.log.filter(function(e){return e.d===k&&e.s==='ok';});
    out.push({d:d,m:es.filter(function(e){return e.t>0;}).length,e:es.reduce(function(a,e){return a+e.p;},0)});
  }
  return out;
}

/* Aviso del creeper */
var CKEY='tareas-mc-creeper';
function actx(){
  var a=snd.c||(snd.c=new (window.AudioContext||window.webkitAudioContext)());
  if(a.state==='suspended')a.resume();
  return a;
}
function noiseSrc(a,sec){
  var n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  var s=a.createBufferSource();s.buffer=b;return s;
}
function hissSnd(){
  try{
    var a=actx(),t=a.currentTime,s=noiseSrc(a,1.4),f=a.createBiquadFilter(),g=a.createGain();
    f.type='highpass';f.frequency.value=2500;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.25,t+1.1);g.gain.linearRampToValueAtTime(0.0001,t+1.4);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);
  }catch(e){}
}
function boomSnd(){
  try{
    var a=actx(),t=a.currentTime,s=noiseSrc(a,1.6),f=a.createBiquadFilter(),g=a.createGain();
    f.type='lowpass';f.frequency.setValueAtTime(1200,t);f.frequency.exponentialRampToValueAtTime(60,t+1.4);
    g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.5);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);
    var o=a.createOscillator(),og=a.createGain();
    o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(30,t+0.8);
    og.gain.setValueAtTime(0.6,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.9);
    o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+0.9);
    var w=a.createOscillator(),wg=a.createGain(),wf=a.createBiquadFilter();
    w.type='sawtooth';w.frequency.setValueAtTime(220,t+0.7);w.frequency.exponentialRampToValueAtTime(70,t+1.9);
    wf.type='lowpass';wf.frequency.value=600;
    wg.gain.setValueAtTime(0.0001,t+0.7);wg.gain.linearRampToValueAtTime(0.18,t+0.9);wg.gain.exponentialRampToValueAtTime(0.001,t+1.9);
    w.connect(wf);wf.connect(wg);wg.connect(a.destination);w.start(t+0.7);w.stop(t+2);
  }catch(e){}
}
var CRMSG=[
  'El Nether se ha enfadado. Ayer no hiciste ninguna misión.',
  'Un creeper se ha colado en casa y ha explotado tu racha.',
  'Los piglins se han comido tu racha. Ayer no hubo misiones.',
  'Un ghast ha gritado desde el Nether: ¡ayer nadie recogió nada!'
];
function lostDay(){
  var y=new Date();y.setDate(y.getDate()-1);
  var yk=fmt(y),w=y.getDay();
  if(S.log.some(function(e){return e.d===yk;}))return null;
  if(!S.log.some(function(e){return e.d<yk;}))return null;
  var sch=S.tasks.some(function(t){return !t.days||!t.days.length||t.days.indexOf(w)>-1;});
  return sch?yk:null;
}
function checkCreeper(){
  var k=lostDay();if(!k)return;
  var seen='';try{seen=localStorage.getItem(CKEY)||'';}catch(e){}
  if(seen===k)return;
  try{localStorage.setItem(CKEY,k);}catch(e){}
  var b=new Date();b.setDate(b.getDate()-2);
  showCreeper(streakAt(b));
}
function showCreeper(lost){
  if(document.getElementById('cr'))return;
  var g=['........','........','.XX..XX.','.XX..XX.','...XX...','..XXXX..','..XXXX..','..X..X..'];
  var sh=['#5fb04a','#4e9a3c','#6cc257','#56a343'];
  var v='<svg viewBox="0 0 8 8" width="150" height="150" shape-rendering="crispEdges" role="img" aria-label="Creeper">';
  g.forEach(function(r,y){for(var x=0;x<8;x++){v+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+(r.charAt(x)==='X'?'#111':sh[(x*3+y*5)%4])+'"/>';}});
  v+='</svg>';
  var m=CRMSG[Math.floor(Math.random()*CRMSG.length)];
  var d=document.createElement('div');d.id='cr';d.className='cr';
  d.innerHTML='<div class="crb"><div id="crf" class="crf"></div>'+
    '<div id="cra"><div class="crc">'+v+'</div><p>¡Ssssss...!</p><button class="btn" onclick="boom()">💥 Toca para desactivarlo</button></div>'+
    '<div id="crz" class="hide"><div class="boom">💥</div><p>'+esc(m)+'</p><p>'+
    (lost>0?'🔥 Racha perdida: '+lost+(lost===1?' día':' días'):'Hoy empieza una racha nueva.')+
    '</p><button class="btn" onclick="closeCr()">Hoy lo arreglo 💪</button></div></div>';
  document.body.appendChild(d);
  hissSnd();
  window.crT=setInterval(function(){var a=document.getElementById('cra');if(a&&a.className!=='hide')hissSnd();},1600);
}
function boom(){
  clearInterval(window.crT);
  document.getElementById('cra').className='hide';
  document.getElementById('crz').className='';
  document.getElementById('crf').className='crf flash';
  boomSnd();
  try{if(navigator.vibrate)navigator.vibrate([200,100,400]);}catch(e){}
}
function closeCr(){
  clearInterval(window.crT);
  var d=document.getElementById('cr');if(d&&d.parentNode)d.parentNode.removeChild(d);
}

/* Avisos y bonus */
function toast(t){
  var d=document.getElementById('toast');
  if(!d){d=document.createElement('div');d.id='toast';d.className='toast';document.body.appendChild(d);}
  d.textContent=t;d.style.display='block';
  clearTimeout(toast.t);toast.t=setTimeout(function(){d.style.display='none';},2800);
}
function setBonus(v){
  if(!/^\d+$/.test(String(v).trim())){toast('Escribe un número entero de esmeraldas, por ejemplo 2');render();return;}
  S.bonus=parseInt(v,10);save();toast('Bonus guardado: '+S.bonus+' 💎 = '+eur(S.bonus*S.rate));render();
}

function tab(v){view=v;msg='';if(v==='k')unlocked=false;render();}

function tapTask(id){
  var e=entry(id);
  if(!e){var t=S.tasks.find(function(x){return x.id===id;});S.log.push({d:today(),t:id,n:t.n,p:t.p,s:'p'});snd([520,620]);}
  else if(e.s==='p'){S.log=S.log.filter(function(x){return x!==e;});}
  save();render();
}
function approve(i){S.log[i].s='ok';bonus();snd([660,880,1320]);save();render();}
function reject(i){S.log.splice(i,1);save();render();}
function pay(){
  var b=balance();if(b<=0)return;
  S.pays.push({d:today(),e:b,a:b*S.rate});save();msg='Pago registrado: '+eur(b*S.rate);render();
}
function tryPin(){
  var v=document.getElementById('pin').value;
  if(v===S.pin){unlocked=true;msg='';}else{msg='PIN incorrecto';}
  render();
}
function setPrice(id,v){var t=S.tasks.find(function(x){return x.id===id;});var n=parseInt(v,10);if(!isNaN(n)&&n>=0){t.p=n;save();}}
function delTask(id){S.tasks=S.tasks.filter(function(x){return x.id!==id;});save();render();}
function addTask(){
  var n=document.getElementById('nn').value.trim();
  var p=parseInt(document.getElementById('np').value,10);
  if(!n)return;
  var ic=document.getElementById('ni').value||guess(n);
  S.tasks.push({id:S.next++,n:n,i:ic,p:isNaN(p)?1:p});save();render();
}
function setRate(v){var n=parseFloat(String(v).replace(',','.'));if(!isNaN(n)&&n>0){S.rate=n;save();render();}}
function setPin(){
  var v=document.getElementById('npin').value.trim();
  if(/^\d{4}$/.test(v)){S.pin=v;save();msg='PIN cambiado';}else{msg='El PIN tiene 4 números';}
  render();
}

function kid(){
  var d=today(),total=todays().length,ok=0;
  todays().forEach(function(t){var e=entry(t.id);if(e&&e.s==='ok')ok++;});
  var b=balance();
  var h='<div class="gui bal"><img class="av" src="'+AV+'" alt="Tu personaje">💎 '+b+' esmeraldas<small>'+eur(b*S.rate)+'</small><small>'+rankTxt()+'</small><small>🔥 Racha: '+streak()+'</small>'+
    '<div class="bar"><i style="width:'+(total?ok/total*100:0)+'%"></i></div>'+
    '<small>Hoy: '+ok+' de '+total+' misiones</small></div>';
  if(S.goal&&S.goal.eur>0){
    var got=b*S.rate,pct=Math.min(100,got/S.goal.eur*100),falta=Math.max(0,S.goal.eur-got);
    h+='<div class="gui bal"><div>🎯 '+esc(S.goal.n)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><small>'+
      (falta>0.004?'Faltan '+Math.ceil(falta/S.rate-0.0001)+' 💎 ('+eur(falta)+')':'¡Meta conseguida! Díselo a papá')+'</small></div>';
  }
  todays().forEach(function(t){
    var e=entry(t.id),c='',st='💎 +'+t.p;
    if(e&&e.s==='p'){c=' p';st='⏳ Esperando';}
    if(e&&e.s==='ok'){c=' ok';st='✅ Hecha';}
    h+='<button class="task'+c+'" onclick="tapTask('+t.id+')"><span class="ic">'+t.i+'</span><span class="nm">'+esc(t.n)+'</span><span class="st">'+st+'</span></button>';
  });
  return h;
}

function parents(){
  if(!unlocked){
    return '<div class="gui"><h2>Zona de papás</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN de 4 números">'+
      '<p class="mute">'+esc(msg)+'</p><button class="btn" onclick="tryPin()">Entrar</button></div>';
  }
  var h='';
  if(msg){toast(msg);msg='';}
  var pend=S.log.map(function(e,i){return{e:e,i:i};}).filter(function(x){return x.e.s==='p';});
  h+='<div class="gui"><h2>Por aprobar</h2>';
  if(!pend.length)h+='<p class="mute">No hay misiones pendientes.</p>';
  pend.forEach(function(x){
    h+='<div class="row"><span class="nm">'+esc(x.e.n)+' <span class="mute">'+x.e.d+'</span></span>'+
      '<button class="btn small" onclick="approve('+x.i+')">Aprobar</button>'+
      '<button class="btn small red" onclick="reject('+x.i+')">Rechazar</button></div>';
  });
  h+='</div>';
  var b=balance();
  h+='<div class="gui"><h2>Saldo</h2><p>💎 '+b+' esmeraldas = '+eur(b*S.rate)+'</p>'+
    '<button class="btn" onclick="pay()"'+(b>0?'':' disabled')+'>Registrar pago</button>';
  if(S.pays.length){
    h+='<p class="mute">Últimos pagos:</p>';
    S.pays.slice(-5).reverse().forEach(function(p){h+='<div class="mute">'+p.d+': '+eur(p.a)+'</div>';});
  }
  h+='</div>';
  h+='<div class="gui"><h2>Misiones</h2>';
  S.tasks.forEach(function(t){
    h+='<div class="row">'+iconSel(t.id,t.i)+'<span class="nm">'+esc(t.n)+'</span>'+
      '<input class="n" type="number" min="0" value="'+t.p+'" onchange="setPrice('+t.id+',this.value)" aria-label="Esmeraldas de '+esc(t.n)+'">'+
      '<button class="btn small red" onclick="delTask('+t.id+')" aria-label="Borrar">✖</button>'+dayBtns(t)+'</div>';
  });
  h+='<div class="row"><input id="nn" class="nm" placeholder="Nueva misión"><select id="ni" aria-label="Dibujo">'+iconOpts('',true)+'</select><input id="np" class="n" type="number" min="0" value="1">'+
    '<button class="btn small" onclick="addTask()">Añadir</button></div></div>';
  h+='<div class="gui"><h2>Resumen semanal</h2>';
  var sm=0,se=0;
  week().forEach(function(x){sm+=x.m;se+=x.e;h+='<div class="row"><span class="nm">'+DN[x.d.getDay()]+' '+x.d.getDate()+'</span><span>'+x.m+' misiones · '+x.e+' 💎</span></div>';});
  h+='<p>Total: '+sm+' misiones, '+se+' 💎 ('+eur(se*S.rate)+')</p></div>';
  var g=S.goal||{n:'',eur:''};
  h+='<div class="gui"><h2>Meta de ahorro</h2><div class="row"><input id="gn" class="nm" placeholder="Premio" value="'+esc(g.n)+'">'+
    '<input id="ge" class="n" placeholder="€" value="'+String(g.eur).replace('.',',')+'"></div>'+
    '<button class="btn small" onclick="setGoal()">Guardar meta</button> <button class="btn small red" onclick="delGoal()">Quitar</button></div>';
  h+='<div class="gui"><h2>Ajustes</h2>'+
    '<div class="row"><button class="btn small" onclick="showCreeper(3)">👀 Probar aviso del creeper</button></div>'+
    '<div class="row"><span class="nm">Bonus por día completo (💎 enteras, 2 = 0,20 €)</span><input class="n" type="number" min="0" value="'+S.bonus+'" onchange="setBonus(this.value)"></div>'+
    '<div class="row"><span class="nm">Valor de 1 esmeralda en €</span><input class="n" value="'+String(S.rate).replace('.',',')+'" onchange="setRate(this.value)"></div>'+
    '<div class="row"><input id="npin" class="nm" inputmode="numeric" maxlength="4" placeholder="Nuevo PIN"><button class="btn small" onclick="setPin()">Cambiar PIN</button></div></div>';
  return h;
}

function render(){
  document.getElementById('tK').className=view==='k'?'':'off';
  document.getElementById('tP').className=view==='p'?'':'off';
  document.getElementById('app').innerHTML=view==='k'?kid():parents();
}
document.getElementById('ico').href=AV;load();render();startSync();
setTimeout(function(){if(!ready)checkCreeper();},8000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
